name: Android build

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Also build the minified release APK (needs the signing secrets)'
        type: boolean
        default: false
      publish:
        description: 'Attach the APK to a GitHub pre-release (easy download link)'
        type: boolean
        default: true

permissions:
  contents: write   # only needed to publish the pre-release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Keys live in GitHub secrets, never in the repo. Missing secrets just leave the feature switched off.
      - name: Write local.properties and optional config files
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          {
            echo "topgun.googleWebClientId=$GOOGLE_WEB_CLIENT_ID"
            echo "topgun.revenueCatKey=$REVENUECAT_ANDROID_KEY"
            echo "topgun.mapsApiKey=$MAPS_API_KEY"
          } > local.properties
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/topgun.keystore"
            echo "TOPGUN_KEYSTORE_PATH=$RUNNER_TEMP/topgun.keystore" >> "$GITHUB_ENV"
            echo "TOPGUN_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "TOPGUN_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "TOPGUN_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Unit tests (core)
        run: chmod +x gradlew && ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Print the signing certificate SHA-1 (register it in Google Cloud for Google sign-in)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate (SHA-1|SHA-256) digest" || true)
          echo "$CERTS"
          {
            echo "### APK signing certificate"
            echo "Register the SHA-1 in Google Cloud (Android OAuth client + Maps key restriction):"
            echo '```'
            echo "$CERTS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: topgun-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish pre-release with the APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Top Gun test build ${{ github.run_number }}
          prerelease: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
