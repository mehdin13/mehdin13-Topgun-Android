org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# API base URLs (trailing slash required). Never put tokens or API keys here.
# Debug builds use the live API too (CI test APKs run on real phones). To use a local Django server instead,
# put e.g. topgun.apiBaseUrl=http://10.0.2.2:8000/api/v1/ (emulator) or http://<computer LAN IP>:8000/api/v1/ in local.properties.
topgun.apiBaseUrl.debug=https://api.topgunapp.com/api/v1/
topgun.apiBaseUrl.release=https://api.topgunapp.com/api/v1/
