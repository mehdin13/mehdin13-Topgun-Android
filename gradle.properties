org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# API base URLs (trailing slash required). Never put tokens here.
# Debug: Android emulator -> host machine's local Django server. Physical device: use the Mac's LAN IP.
dreamland.apiBaseUrl.debug=http://10.0.2.2:8000/api/
# Release: confirm the API path prefix (see docs/BACKEND_GAPS.md in dreamland-ios).
dreamland.apiBaseUrl.release=https://dreamland.noova.uk/api/
